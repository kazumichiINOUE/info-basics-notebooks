<div id="__ID__" style="display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; padding:12px; background:#fff; color:#222;
     font-family:'Hiragino Sans','Noto Sans JP',sans-serif">
  <div>
    <div class="grid" style="display:grid; grid-template-columns:repeat(8, 30px); gap:2px; touch-action:none; user-select:none"></div>
    <div style="margin-top:10px; display:flex; gap:10px; align-items:center">
      <button class="clr" style="font-size:14px; padding:4px 12px">すべて消す</button>
      <span class="hex" style="font-family:monospace; color:#777; font-size:13px"></span>
    </div>
  </div>
  <div class="res" style="display:flex; gap:28px; flex-wrap:wrap"></div>
</div>
<script>
(function () {
  const root = document.getElementById("__ID__");
  const progs = __PROGS__;
  const grid = root.querySelector(".grid"), res = root.querySelector(".res");
  const bits = new Array(64).fill(0), cells = [];
  let paint = null, busy = false, again = false;
  for (let i = 0; i < 64; i++) {
    const c = document.createElement("div");
    c.dataset.i = i;
    c.style.cssText = "width:30px; height:30px; background:#fff; border:1px solid #bbb; box-sizing:border-box; cursor:pointer";
    grid.appendChild(c);
    cells.push(c);
  }
  function cellAt(e) {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    return el && el.parentNode === grid ? +el.dataset.i : -1;
  }
  function set(i) {
    if (i < 0) return;
    bits[i] = paint;
    cells[i].style.background = paint ? "#222" : "#fff";
  }
  grid.addEventListener("pointerdown", function (e) {
    const i = cellAt(e);
    if (i < 0) return;
    e.preventDefault();
    paint = bits[i] ? 0 : 1;          // 塗られたマスから始めたときは消す
    set(i);
  });
  window.addEventListener("pointermove", function (e) { if (paint !== null) set(cellAt(e)); });
  window.addEventListener("pointerup", function () { if (paint !== null) { paint = null; update(); } });
  root.querySelector(".clr").addEventListener("click", function () {
    bits.fill(0);
    cells.forEach(function (c) { c.style.background = "#fff"; });
    update();
  });
  function hex() {
    let s = "";
    for (let k = 0; k < 16; k++) {
      let v = 0;
      for (let b = 0; b < 4; b++) v = v * 2 + bits[k * 4 + b];
      s += v.toString(16).toUpperCase();
    }
    return s;
  }
  async function update() {
    const h = hex();
    root.querySelector(".hex").textContent = h;
    if (!bits.some(function (b) { return b; })) {
      res.innerHTML = "<p style='color:#777; margin:0'>マスを押して（なぞって）絵を描く．塗ったマスを押すと消える</p>";
      return;
    }
    if (busy) { again = true; return; }
    busy = true;
    try {
      const r = await google.colab.kernel.invokeFunction("__NAME__", [h], {});
      render(r.data["application/json"]);
    } catch (err) {
      res.textContent = "計算できなかった．上のセルから順に実行し直す（" + err + "）";
    }
    busy = false;
    if (again) { again = false; update(); }
  }
  function render(all) {
    res.innerHTML = "";
    all.forEach(function (p, n) {
      const top = p.indexOf(Math.max.apply(null, p));
      const box = document.createElement("div");
      let html = "<div style='font-weight:700; margin-bottom:6px'>" + progs[n] + "</div>" +
                 "<div style='display:flex; gap:5px; align-items:flex-end; height:130px; border-bottom:1px solid #bbb'>";
      for (let k = 0; k < 10; k++) {
        const hgt = Math.max(1, Math.round(p[k] * 120));
        html += "<div style='width:22px; height:" + hgt + "px; background:" + (k === top ? "#c0392b" : "#8a857e") + "'></div>";
      }
      html += "</div><div style='display:flex; gap:5px'>";
      for (let k = 0; k < 10; k++)
        html += "<div style='width:22px; text-align:center; font-size:13px; " + (k === top ? "color:#c0392b; font-weight:700" : "color:#777") + "'>" + k + "</div>";
      html += "</div><div style='margin-top:6px; font-size:14px'>確率が最大のラベル <b>" + top + "</b>　確率 <b>" + p[top].toFixed(3) + "</b></div>";
      box.innerHTML = html;
      res.appendChild(box);
    });
  }
  update();
})();
</script>
